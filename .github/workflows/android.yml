name: Android APK erstellen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK prüfen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --list_installed | grep -E 'platforms;android-35|build-tools;35.0.0' || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Kontaktimport und Ferienlogik testen
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: App kompilieren
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: APK prüfen
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: GeburtstagsAssistent-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
